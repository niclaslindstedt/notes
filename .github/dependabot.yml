# Lockfile-only. The version ranges in package.json move together across
# the apps, by hand, and a new major is tried in one app first; this keeps
# each lockfile on the newest release inside those ranges. Security updates
# come on their own, from the repository's settings. GitHub Actions are
# pinned to major tags, so their only updates are majors, which move by hand
# too.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/native", "/tauri"]
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    groups:
      lockfiles:
        patterns: ["*"]
    labels: ["dependencies", "no-changelog"]
    open-pull-requests-limit: 5
