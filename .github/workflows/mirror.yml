name: Mirror

# Push main to an external git mirror on every commit to main, so the
# sibling projects (checklist / budget) can `git clone` this repo with
# full history — even from sandboxes where github.com egress is blocked
# (403). Provider-agnostic: GitLab, Codeberg / Gitea, Bitbucket, self-hosted.
#
# Setup (the job is a no-op until configured):
#   - secret   MIRROR_URL    e.g. `gitlab.com/<ns>/notes.git`
#   - secret   MIRROR_TOKEN  a push token / PAT with write access
#   - secret   MIRROR_USER   (optional) basic-auth username paired with
#                            the token; defaults to `oauth2` (GitLab). Use
#                            `x-token-auth` for Bitbucket, your username
#                            for Gitea / Codeberg.
#
# All three are secrets — this repo keeps no Actions variables. A secret
# cannot be tested in `if:`, so the gate below reads it through `env`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two mirror pushes race; let an in-flight one finish.
concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      MIRROR_URL: ${{ secrets.MIRROR_URL }}
    steps:
      # Inert (every other step skipped) until the mirror is configured. The
      # gate is per step rather than on the job because a job-level `if:` can
      # see neither secrets nor env.
      - name: Mirror not configured
        if: env.MIRROR_URL == ''
        run: echo "MIRROR_URL is not set — nothing to mirror."

      # fetch-depth: 0 so the mirror gets full history and stays cloneable
      # with history, not just the latest commit.
      - uses: actions/checkout@v7
        if: env.MIRROR_URL != ''
        with:
          fetch-depth: 0

      - name: Push main to the mirror
        if: env.MIRROR_URL != ''
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_USER: ${{ secrets.MIRROR_USER }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::MIRROR_URL is set but the MIRROR_TOKEN secret is missing."
            exit 1
          fi
          git push --force \
            "https://${MIRROR_USER:-oauth2}:${MIRROR_TOKEN}@${MIRROR_URL}" \
            HEAD:refs/heads/main
