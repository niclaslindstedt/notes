name: Package the desktop app
description: >
  Build the site, bundle it into the Tauri shell, and produce this runner's
  installers. Shared by desktop-tauri.yml (the dispatch-only "does it still
  package?" button) and release.yml (the downloads attached to every release),
  so the two can never drift into packaging differently.

inputs:
  target:
    description: windows | macos | linux — which runner this is.
    required: true
  npm-token:
    description: >
      A token with `read:packages`. `npm ci` resolves
      @niclaslindstedt/oss-framework from the GitHub Packages registry, which
      requires auth even for a public package.
    required: true
  display-name:
    description: >
      APP_DISPLAY_NAME — the listing name the package installs as. Empty keeps
      the project's own name.
    required: false
    default: ""
  bundle-id:
    description: >
      APP_BUNDLE_ID — the identifier the package installs under, and so where
      the installed app keeps its data. Empty keeps the development one.
    required: false
    default: ""
  release:
    description: >
      "true" for a package that ships: refuses to fall back to the
      development identity.
    required: false
    default: "false"
  dropbox-app-key:
    description: >
      VITE_DROPBOX_APP_KEY for the site build inside the package. Empty builds
      an app with no Dropbox backend to offer.
    required: false
    default: ""
  dropbox-app-folder:
    description: VITE_DROPBOX_APP_FOLDER for the same build.
    required: false
    default: ""
  # macOS SIGNING AND NOTARIZATION — all optional, and all empty in a fork.
  # With no certificate the app is signed ad hoc, exactly as before; see
  # .github/actions/apple-signing.
  mac-certificate:
    description: MAC_CSC_LINK — the Developer ID Application .p12, base64.
    required: false
    default: ""
  mac-certificate-password:
    description: MAC_CSC_KEY_PASSWORD — the password the .p12 was exported with.
    required: false
    default: ""
  mac-sign-identity:
    description: >
      MAC_SIGN_IDENTITY — optional; read out of the certificate when empty,
      and ignored when there is no certificate.
    required: false
    default: ""
  apple-id:
    description: APPLE_ID — the Apple Account that notarizes.
    required: false
    default: ""
  apple-password:
    description: APPLE_APP_SPECIFIC_PASSWORD — an app-specific password for it.
    required: false
    default: ""
  apple-team-id:
    description: APPLE_TEAM_ID — the ten-character team id.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm
        registry-url: "https://npm.pkg.github.com"
        scope: "@niclaslindstedt"
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: tauri

    # WebKitGTK is the webview on Linux, and the bundler wants `patchelf` and
    # librsvg for the AppImage. Windows has WebView2 in the image and macOS has
    # WKWebView in the OS, so neither needs anything.
    - name: Linux packaging libraries
      if: inputs.target == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
          libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

    # The site build lives in the root project; the shell only carries its
    # output. `tauri/` is deliberately not a workspace member — it has its own
    # toolchain — so it is a second, tiny install.
    - name: Install
      shell: bash
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
    - name: Install the shell's own tooling
      shell: bash
      run: npm ci --prefix tauri

    # Turns Tauri's ad-hoc fallback into a real Developer ID signature, by
    # importing the certificate and exporting APPLE_SIGNING_IDENTITY for the
    # step below. A no-op with a warning when no certificate is given, so the
    # identity is never set without a key behind it.
    - name: Apple signing
      if: inputs.target == 'macos'
      uses: ./.github/actions/apple-signing
      with:
        certificate: ${{ inputs.mac-certificate }}
        certificate-password: ${{ inputs.mac-certificate-password }}
        identity: ${{ inputs.mac-sign-identity }}

    # `npm run package` is `scripts/package.mjs`: `bundle-web.mjs` (which
    # builds the site with the service worker off), then `tauri build` with the
    # identity below merged over the committed config. Going through the
    # shell's own script rather than calling `tauri build` here is what keeps a
    # release build identical to the one a maintainer makes locally.
    - name: Package
      shell: bash
      env:
        APP_DISPLAY_NAME: ${{ inputs.display-name }}
        APP_BUNDLE_ID: ${{ inputs.bundle-id }}
        RELEASE: ${{ inputs.release }}
        VITE_DROPBOX_APP_KEY: ${{ inputs.dropbox-app-key }}
        VITE_DROPBOX_APP_FOLDER: ${{ inputs.dropbox-app-folder }}
        # NOTARIZATION. The bundler acts on these only once the app is signed
        # with a real identity (the step above), and ignores them otherwise.
        # `APPLE_PASSWORD` is the bundler's name for an app-specific password.
        APPLE_ID: ${{ inputs.apple-id }}
        APPLE_PASSWORD: ${{ inputs.apple-password }}
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
      run: |
        # An empty input is "not provided", not an empty value: the app falls
        # back to its defaults only for a variable that is absent.
        [ -n "$VITE_DROPBOX_APP_KEY" ] || unset VITE_DROPBOX_APP_KEY
        [ -n "$VITE_DROPBOX_APP_FOLDER" ] || unset VITE_DROPBOX_APP_FOLDER
        # An empty Apple variable is unset for the same reason: the bundler
        # should see no notarization credentials, not blank ones.
        [ -n "$APPLE_ID" ] || unset APPLE_ID
        [ -n "$APPLE_PASSWORD" ] || unset APPLE_PASSWORD
        [ -n "$APPLE_TEAM_ID" ] || unset APPLE_TEAM_ID
        if [ "$RELEASE" = "true" ]; then
          npm run package --prefix tauri -- --require-identity
        else
          npm run package --prefix tauri
        fi
